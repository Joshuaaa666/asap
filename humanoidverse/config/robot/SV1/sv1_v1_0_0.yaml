      'MAL1_SHP', 'MAL2_SHR', 'MAL3_SHY', 'MAL4_ELP', 'MAL5_WRY', 'MAL6_WRP',
      'MAR1_SHP', 'MAR2_SHR', 'MAR3_SHY', 'MAR4_ELP', 'MAR5_WRY', 'MAR6_WRP',
