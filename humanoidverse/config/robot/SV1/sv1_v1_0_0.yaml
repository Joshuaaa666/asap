    1.919862151145935, 3.4028234663852886e+38, 1.919862151145935, 3.4028234663852886e+38
  ]
  dof_vel_limit_list: [
    1000000000.0, 1000000000.0, 1000000000.0,
    1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0,
    1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0,
    1000000000.0, 1000000000.0,
    1000000000.0, 3.4028234663852886e+38, 1000000000.0, 3.4028234663852886e+38,
    1000000000.0, 3.4028234663852886e+38, 1000000000.0, 3.4028234663852886e+38
  ]
  dof_effort_limit_list: [
    1000000000.0, 1000000000.0, 1000000000.0,
    1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0,
    1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0, 1000000000.0,
    1000000000.0, 1000000000.0,
    1000000000.0, 3.4028234663852886e+38, 1000000000.0, 3.4028234663852886e+38,
    1000000000.0, 3.4028234663852886e+38, 1000000000.0, 3.4028234663852886e+38
  ]

  # 供 IsaacSim 使用；长度与顺序必须和 dof_names 一致。
  dof_armature_list: [
    0.03, 0.03, 0.03,
    0.03, 0.03, 0.03, 0.03, 0.02, 0.02,
    0.03, 0.03, 0.03, 0.03, 0.02, 0.02,
    0.02, 0.02,
    0.03, 0.01, 0.03, 0.01, 0.03, 0.01, 0.03, 0.01
  ]
  dof_joint_friction_list: [
    0.03, 0.03, 0.03,
    0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
    0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
    0.03, 0.03,
    0.03, 0.02, 0.03, 0.02, 0.03, 0.02, 0.03, 0.02
  ]

  # URDF 导入后的完整刚体名列表（不是 motion xml 的 body 列表）。
  body_names: [
    'MBASE', 'MWAIST_BASE', 'MWB1_WAISTR', 'MWB2_WAISTY', 'MWB3_WAISTP',
    'MAL0_BASE', 'MAL1_SHP', 'MAL2_SHR', 'MAL3_SHY', 'MAL4_ELP', 'FAL4_ELP', 'MAL5_WRY', 'MAL6_WRP', 'FAL6_WRP',
