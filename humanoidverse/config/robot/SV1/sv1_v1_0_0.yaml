    'MFL1_HIPR', 'MFR1_HIPR', 'MRL1_HIPR', 'MRR1_HIPR'
  ]

  control:
    control_type: P
    # 代码里是“子串匹配”关节名，键写得更具体可以避免误匹配。
    stiffness:
      waistr: 800
      waisty: 800
      waistp: 800
      armr: 300
      armp: 250
      army: 200
      elbp: 150
      wristy: 80
      wristr: 50
      head: 100
      hipr: 200
      wheel: 20
    damping:
      waistr: 80
      waisty: 80
      waistp: 80
      armr: 30
      armp: 25
      army: 20
      elbp: 15
      wristy: 8
      wristr: 5
      head: 10
      hipr: 20
      wheel: 2
    action_scale: 0.25
    action_clip_value: 100.0
    clip_torques: True

  asset:
    collapse_fixed_joints: True
    replace_cylinder_with_capsule: True
    flip_visual_attachments: False
    armature: 0.001
    thickness: 0.01
    max_angular_velocity: 1000.0
    max_linear_velocity: 1000.0
    density: 0.001
    angular_damping: 0.0
    linear_damping: 0.0

    
    
    urdf_file: "SR1_V1_0_0/sr1_v1_0_0.urdf"
    usd_file: "SR1_V1_0_0/sr1_v1_0_0.usd"
    xml_file: "SR1_V1_0_0/sr1_v1_mocap.xml"
    robot_type: sv1_v1_0_0

    self_collisions: 1
    default_dof_drive_mode: 3
    fix_base_link: False

  motion:
    # 这里填写重定向后的 ASAP 标准 motion 文件（含 root_trans_offset/pose_aa/fps）。
    motion_file: "humanoidverse/data/motions/sv1_v1_0_0/TairanTestbed/singles/0-motions_raw_tairantestbed_smpl_video_CR7_level1_filter_amass.pkl"

    asset:
      assetRoot: "humanoidverse/data/robots/SR1_V1_0_0/"
      assetFileName: "sr1_v1_mocap.xml"
      urdfFileName: "sr1_v1_0_0.urdf"

    humanoid_type: sv1_v1_0_0
    bias_offset: False
    has_self_collision: True
    has_mesh: False
    has_jt_limit: False
    has_dof_subset: True
    has_upright_start: True
    has_smpl_pd_offset: False
    remove_toe: False
    motion_sym_loss: False
    sym_loss_coef: 1
    big_ankle: False

    has_shape_obs: false
    has_shape_obs_disc: false
    has_shape_variation: False

    masterfoot: False
    freeze_toe: false
    freeze_hand: False
    box_body: True
    real_weight: True
    real_weight_porpotion_capsules: True
    real_weight_porpotion_boxes: True

    # 这里的 body 名称应与 Humanoid_Batch 使用的 mocap xml 链条保持一致。
