    rot: [0.0, 0.0, 0.0, 1.0]
    lin_vel: [0.0, 0.0, 0.0]
    ang_vel: [0.0, 0.0, 0.0]
    # 初始先全部设为 0；后续可按机器人静态站姿再微调。
    default_joint_angles:
      Jwb1_waistr: 0.0
      Jwb2_waisty: 0.0
      Jwb3_waistp: 0.0
      Jal1_armr: 0.0
      Jal2_armp: 0.0
      Jal3_army: 0.0
      Jal4_elbp: 0.0
      Jal5_wristy: 0.0
      Jal6_wristr: 0.0
      Jar1_armr: 0.0
      Jar2_armp: 0.0
      Jar3_army: 0.0
      Jar4_elbp: 0.0
      Jar5_wristy: 0.0
      Jar6_wristr: 0.0
      Jhd1_heady: 0.0
      Jhd2_headp: 0.0
      Jfl1_hipr: 0.0
      Jfl2_wheel: 0.0
      Jfr1_hipr: 0.0
      Jfr2_wheel: 0.0
      Jrl1_hipr: 0.0
      Jrl2_wheel: 0.0
      Jrr1_hipr: 0.0
      Jrr2_wheel: 0.0

