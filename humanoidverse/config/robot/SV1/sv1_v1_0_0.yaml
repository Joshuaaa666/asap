# @package _global_

defaults:
  - robot_base

robot:
  # Observation parameters (添加以下三行)
  policy_obs_dim: -1 
  critic_obs_dim: -1
  
  # -----------------------------
  # 机器人核心维度
  # -----------------------------
  # 注意：这些数量与 IsaacGym 实际加载 SR1_V1.0.0.urdf 后的结果一致。
  num_bodies: 34
  dof_obs_size: 25
  actions_dim: 25

  # 为解耦逻辑预留的上下半身动作维度；这里给 SV1 先用稳妥默认值。
  lower_body_actions_dim: 11
  upper_body_actions_dim: 14
  has_upper_body_dof: True

  # 轮足机器人的足端/接触体定义。
  key_bodies: ["MFL2_WHEEL", "MFR2_WHEEL", "MRL2_WHEEL", "MRR2_WHEEL"]
  contact_bodies: ["MFL2_WHEEL", "MFR2_WHEEL", "MRL2_WHEEL", "MRR2_WHEEL"]
  num_feet: 4
  left_foot_name: "MFL2_WHEEL"
  right_foot_name: "MFR2_WHEEL"
  foot_name: "WHEEL"
  knee_name: "HIPR"

  has_torso: True
  torso_name: "MWB3_WAISTP"

  # -----------------------------
  # DOF 顺序（必须与 IsaacGym 读取 URDF 的顺序完全一致）
  # -----------------------------
  dof_names: [
    'Jwb1_waistr', 'Jwb2_waisty', 'Jwb3_waistp',
    'Jal1_armr', 'Jal2_armp', 'Jal3_army', 'Jal4_elbp', 'Jal5_wristy', 'Jal6_wristr',
    'Jar1_armr', 'Jar2_armp', 'Jar3_army', 'Jar4_elbp', 'Jar5_wristy', 'Jar6_wristr',
    'Jhd1_heady', 'Jhd2_headp',
    'Jfl1_hipr', 'Jfl2_wheel', 'Jfr1_hipr', 'Jfr2_wheel', 'Jrl1_hipr', 'Jrl2_wheel', 'Jrr1_hipr', 'Jrr2_wheel'
  ]

  upper_dof_names: [
    'Jal1_armr', 'Jal2_armp', 'Jal3_army', 'Jal4_elbp', 'Jal5_wristy', 'Jal6_wristr',
    'Jar1_armr', 'Jar2_armp', 'Jar3_army', 'Jar4_elbp', 'Jar5_wristy', 'Jar6_wristr',
    'Jhd1_heady', 'Jhd2_headp'
  ]
  upper_left_arm_dof_names: ['Jal1_armr', 'Jal2_armp', 'Jal3_army', 'Jal4_elbp', 'Jal5_wristy', 'Jal6_wristr']
  upper_right_arm_dof_names: ['Jar1_armr', 'Jar2_armp', 'Jar3_army', 'Jar4_elbp', 'Jar5_wristy', 'Jar6_wristr']
