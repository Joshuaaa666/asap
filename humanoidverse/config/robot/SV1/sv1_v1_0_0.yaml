      - "MAL4_ELP"
      - "MAL5_WRY"
      - "MAL6_WRP"
      - "MAR1_SHP"
      - "MAR2_SHR"
      - "MAR3_SHY"
      - "MAR4_ELP"
      - "MAR5_WRY"
      - "MAR6_WRP"
      - "MHD1_HEADY"
      - "MHD2_HEADP"

    pelvis_link: "MWB3_WAISTP"
