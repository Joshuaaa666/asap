  waist_dof_names: ['Jwb1_waistr', 'Jwb2_waisty', 'Jwb3_waistp']

  # -----------------------------
  # 关节限制（与 IsaacGym 实际解析值对齐）
  # -----------------------------
  dof_pos_lower_limit_list: [
    -1.2217304706573486, -2.094395160675049, -0.8726645708084106,
    -2.268928050994873, -3.1415927410125732, -1.570796251296997, 0.0, -1.570796251296997, -0.8726645708084106,
    -2.268928050994873, -0.10471980273723602, -1.570796251296997, 0.0, -1.570796251296997, -0.8726645708084106,
    -1.570796251296997, -0.5585054159164429,
    -1.919862151145935, -3.4028234663852886e+38, -1.919862151145935, -3.4028234663852886e+38,
    -1.919862151145935, -3.4028234663852886e+38, -1.919862151145935, -3.4028234663852886e+38
  ]
  dof_pos_upper_limit_list: [
    0.08726649731397629, 0.7853981852531433, 0.1745329052209854,
    3.1415927410125732, 0.10471980273723602, 1.570796251296997, 2.094395160675049, 1.570796251296997, 0.8726645708084106,
